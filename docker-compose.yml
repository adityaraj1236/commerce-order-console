services:
  postgres:
    image: postgres:16.10-alpine
    container_name: commerce-console-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-commerce_console}
    ports:
      # Host port 5434 avoids clashing with locally installed PostgreSQL servers (5432/5433).
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-commerce_console}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
